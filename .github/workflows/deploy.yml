name: CD - Trien khai len VPS Production

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Trien khai len VPS qua SSH
    # Chi tu dong deploy khi da bat bien ENABLE_AUTO_DEPLOY = 'true' trong GitHub Repo Variables (hoac bam Run workflow thu cong)
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Ket noi SSH & Cap nhat he thong Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH || '/var/www/bookverse' }}"

            # Backup DB nhanh truoc khi cap nhat
            if [ -x scripts/backup-db.sh ]; then
              ./scripts/backup-db.sh
            fi

            # Keo code moi nhat tu GitHub
            git pull origin "${{ github.ref_name }}"

            # Build va cap nhat container theo cau hinh Production (khong downtime dai)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans

            # Don dep image cu
            docker image prune -f
