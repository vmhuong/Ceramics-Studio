# Cấu hình Redis Cache cho WordPress Object Cache
maxmemory 256mb
maxmemory-policy allkeys-lru

# Tắt lưu trữ đĩa định kỳ vì đây là bộ nhớ đệm tạm thời (tiết kiệm I/O ổ cứng)
save ""
appendonly no

# Timeout kết nối
timeout 300
tcp-keepalive 60

# Bảo mật - password được truyền qua biến môi trường REDIS_PASSWORD trong docker-compose.yml
# requirepass <set via REDIS_PASSWORD env>

# Chỉ chấp nhận kết nối từ mạng nội bộ Docker
bind 0.0.0.0

# Tắt lệnh nguy hiểm
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG "REDIS_CONFIG_BOOKVERSE"
rename-command DEBUG ""
