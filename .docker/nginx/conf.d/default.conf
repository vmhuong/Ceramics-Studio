server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html index.htm;

    # Nhật ký truy cập và lỗi
    access_log /var/log/nginx/bookverse_access.log;
    error_log /var/log/nginx/bookverse_error.log;

    # Security Headers - chống XSS, Clickjacking, MIME sniffing
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Định tuyến WordPress & WooCommerce (Pretty Permalinks)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Rate limit wp-login.php - chống brute force (tối đa 5 lần/phút)
    location = /wp-login.php {
        limit_req zone=wp_login burst=3 nodelay;
        limit_req_status 429;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    # Rate limit REST API - chống spam API (tối đa 30 req/giây)
    location /wp-json/ {
        limit_req zone=wp_api burst=50 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    # Xử lý PHP thông qua container PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    # Bộ nhớ đệm tài nguyên tĩnh (Ảnh, CSS, JS, Fonts)
    location ~* \.(jpg|jpeg|gif|png|webp|svg|css|js|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # Chặn thực thi file PHP trong thư mục tải lên uploads (Bảo mật tối cao)
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # Chặn truy cập các file ẩn hệ thống (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Chặn truy cập file wp-config.php trực tiếp từ trình duyệt
    location = /wp-config.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Chặn xmlrpc.php để chống tấn công Brute-Force & DDoS
    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Tắt log cho robots.txt và favicon.ico để đỡ rác nhật ký
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
