; PHP-FPM Pool Configuration - Tối ưu cho WordPress + WooCommerce
; Tính toán: RAM dành cho PHP ~400MB / ~25MB mỗi process ≈ 16-20 workers

[www]
user = www-data
group = www-data

; Lắng nghe trên TCP socket (phù hợp Docker multi-container)
listen = 9000

; Chế độ dynamic: tự điều chỉnh số worker theo tải thực tế
pm = dynamic

; Tối đa 20 PHP-FPM processes chạy đồng thời
pm.max_children = 20

; Khởi động với 4 processes sẵn sàng
pm.start_servers = 4

; Giữ tối thiểu 2 worker rảnh (phản hồi nhanh khi có request)
pm.min_spare_servers = 2

; Giữ tối đa 8 worker rảnh (tránh lãng phí RAM)
pm.max_spare_servers = 8

; Restart mỗi process sau 500 requests - chống memory leak WordPress
pm.max_requests = 500

; Health check endpoints
pm.status_path = /status
ping.path = /ping
ping.response = pong

; Log slow requests (> 5 giây)
slowlog = /var/log/php-fpm/www-slow.log
request_slowlog_timeout = 5s

; Giới hạn thời gian xử lý tối đa mỗi request
request_terminate_timeout = 300s
